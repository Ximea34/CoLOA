<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>AMAN — Assistant LoA</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="aman.css">
</head>
<body class="aman-body">

<div class="aman-connect">
  <span class="dot" id="dot"></span>
  <span id="state">Hors ligne</span>
  <span class="grow"></span>
  <button id="dock" class="ghost" hidden>Rattacher</button>
</div>

<form class="aman-form" id="form">
  <label>Aéroport
    <input type="text" id="airport" maxlength="4" placeholder="LFML" autocomplete="off">
  </label>
  <label>Config piste
    <select id="runwayConfig"><option value="">—</option></select>
  </label>
  <button type="submit" id="go">Actualiser</button>
  <span class="grow"></span>
  <label class="zoom-label">Zoom
    <input type="range" id="zoom" min="20" max="90" value="45" step="5">
  </label>
  <button type="button" id="timeToggle" class="ghost">UTC</button>
</form>

<div class="aman-ladder" id="ladder">
  <p class="empty" id="ladderEmpty">Renseigne un aéroport, puis Actualiser.</p>
  <div class="lanes" id="lanes" hidden></div>
</div>

<script src="aman-renderer.js"></script>
</body>
</html>
